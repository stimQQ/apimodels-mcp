    # ── 托管 MCP 服务器(apimodels-mcp serve,容器 apimodels-mcp-remote → 127.0.0.1:8095,2026-10-10)──
    # /mcp:Streamable HTTP(POST;工具调用每次最多等 ~50s,SSE 流式返回);/upload/<token>:智能体
    # curl -T 上传本地文件;/.well-known/oauth-protected-resource:RFC 9728 元数据(OAuth 发现入口)。
    # 放在 `location / { return 404; }` 之前。
    location ~ ^/(mcp/?|upload/[A-Za-z0-9_-]+|\.well-known/oauth-protected-resource(/mcp)?)$ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;
    }
